name: Builds natifs de test

# Test précoce de la fin de la phase 2 (spec 9) : le bac à sable de l'éditeur emballé pour
# Android (Capacitor). Lancé à la main, ou quand l'éditeur ou l'emballage changent. Les
# applications pour ordinateur ont leur propre workflow depuis la phase 8 (desktop.yml).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/web/src/features/editor/**
      - apps/web/src/sandbox/**
      - apps/web/src/index.css
      - apps/web/sandbox.html
      - apps/mobile/**
      - apps/desktop/app-icon.svg
      - .github/workflows/native.yml

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK de test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Bac à sable de l'éditeur
        run: pnpm --filter @nonotion/web build:sandbox

      - name: Projet Android
        working-directory: apps/mobile
        run: |
          pnpm add:android
          pnpm sync:android

      - name: Icône Nonotion
        run: |
          pnpm --filter @nonotion/desktop icons
          cp -r apps/desktop/src-tauri/icons/android/. apps/mobile/android/app/src/main/res/

      - name: APK de débogage
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nonotion-editeur-android
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
