name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push annule le run en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        # Même branche que l'hébergement Infomaniak (MariaDB 10.11.19).
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: nonotion_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          # Même version que l'hébergement Infomaniak.
          php-version: '8.5'
          extensions: curl, fileinfo, intl, mbstring, openssl, pdo_mysql
          tools: composer:v2

      - name: Dépendances
        run: |
          pnpm install --frozen-lockfile
          composer install --no-interaction --prefer-dist --working-dir=apps/api

      - name: Configuration de l'API
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (ESLint, Prettier, Pint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitaires (Vitest, Pest)
        run: pnpm test

      # Étape à part : le miroir Ubuntu est parfois très lent, ce temps ne doit pas manger celui des tests.
      - name: Navigateurs de test (Playwright)
        timeout-minutes: 25
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Tests de bout en bout (Chromium, Firefox, WebKit)
        timeout-minutes: 12
        env:
          DB_DATABASE: nonotion_test
        run: |
          php apps/api/artisan migrate:fresh --force
          pnpm test:e2e
