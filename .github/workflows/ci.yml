name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push annule le run en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        # Même branche que l'hébergement Infomaniak (MariaDB 10.11.19).
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: nonotion_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          # Même version que l'hébergement Infomaniak.
          php-version: '8.5'
          extensions: curl, fileinfo, intl, mbstring, openssl, pdo_mysql
          tools: composer:v2

      - name: Dépendances
        run: |
          pnpm install --frozen-lockfile
          composer install --no-interaction --prefer-dist --working-dir=apps/api

      - name: Configuration de l'API
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (ESLint, Prettier, Pint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitaires (Vitest, Pest)
        run: pnpm test

      # Les navigateurs et leurs paquets système sont gardés d'une exécution à l'autre : le miroir
      # Ubuntu est parfois si lent (60 ko/s) que leur seul téléchargement dépassait le temps des tests.
      - name: Version de Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Navigateurs de test en cache
        id: browsers-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Navigateurs de test (Playwright)
        timeout-minutes: 25
        run: |
          mkdir -p ~/.cache/playwright-apt
          # Paquets déjà téléchargés une fois : apt les prend ici plutôt que sur le miroir.
          sudo cp ~/.cache/playwright-apt/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          pnpm exec playwright install --with-deps chromium firefox webkit
          cp /var/cache/apt/archives/*.deb ~/.cache/playwright-apt/ 2>/dev/null || true

      # Enregistré tout de suite (pas en fin de travail) : même si un test échoue ensuite.
      - name: Mise en cache des navigateurs de test
        if: steps.browsers-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: ${{ steps.browsers-cache.outputs.cache-primary-key }}

      - name: Tests de bout en bout (Chromium, Firefox, WebKit)
        timeout-minutes: 12
        env:
          DB_DATABASE: nonotion_test
          # Le petit serveur d'agendas des tests d'import ICS (un port par processus de test).
          ICS_ALLOW_PRIVATE_HOSTS: 127.0.0.1:8765,127.0.0.1:8766,127.0.0.1:8767,127.0.0.1:8768
        run: |
          php apps/api/artisan migrate:fresh --force
          pnpm test:e2e
